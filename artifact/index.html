<title>DailyMTB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* single dark world; full-screen canvas */
:root{--bg:#141a16;--fg:#e6ece4;--dim:#8a9a8c;--accent:#d9a441;color-scheme:dark}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{font-family:system-ui,sans-serif;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
canvas{width:100%;max-width:900px;aspect-ratio:16/9;background:#1c2620;border-radius:4px}
p{color:var(--dim);margin:8px 0 0}
b{color:var(--accent)}
</style>
<div><canvas id="c" width="900" height="506"></canvas><p><b>DailyMTB</b> · test build 0 · seed <span id="s"></span></p></div>
<script>
const d=new Date().toISOString().slice(0,10);document.getElementById('s').textContent=d;
let h=0;for(const ch of d)h=(h*31+ch.charCodeAt(0))>>>0;
const r=()=>(h=(h*1664525+1013904223)>>>0)/2**32;
const c=document.getElementById('c').getContext('2d');
c.strokeStyle='#d9a441';c.lineWidth=3;c.beginPath();
let y=80;for(let x=0;x<=900;x+=10){y+=1.4+(r()-.5)*8;c.lineTo(x,y)}c.stroke();
</script>
